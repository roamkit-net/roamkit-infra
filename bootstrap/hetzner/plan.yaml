# RoamKit staging — declarative deployment spec
# Human-readable checklist + machine-parseable structure.
# Source: PLAN.md · stack: /opt/stacks/roamkit-net

meta:
  host: root@Ubuntu-2204-jammy-amd64-base
  stack_dir: /opt/stacks/roamkit-net
  origin_ip: 65.108.196.92
  traefik_path: /opt/stacks/traefik
  zone: roamkit.net
  compose_file: docker-compose.yml
  deploy_script: scripts/deploy-staging.sh

prerequisites:
  traefik:
    container_name: traefik
    network: proxy
    cert_resolver: cloudflare
    entrypoints:
      - websecure
    ports:
      - 80
      - 443
  checks:
    - command: docker ps --filter name=traefik
      expect: container traefik is Up
    - command: docker network inspect proxy --format '{{.Name}}'
      expect: network proxy exists
    - command: ss -tlnp | grep -E ':80|:443'
      expect: ports 80 and 443 listening on host

dns:
  zone: roamkit.net
  records:
    - name: "@"
      fqdn: roamkit.net
      type: A
      value: 65.108.196.92
      proxied: true
      purpose: marketing landing
    - name: www
      fqdn: www.roamkit.net
      type: A
      value: 65.108.196.92
      proxied: true
      purpose: marketing landing (www redirect via Traefik)
    - name: staging
      fqdn: staging.roamkit.net
      type: A
      value: 65.108.196.92
      proxied: true
      purpose: web staging
    - name: api.staging
      fqdn: api.staging.roamkit.net
      type: A
      value: 65.108.196.92
      proxied: true
      purpose: api staging
  verify:
    - command: dig +short roamkit.net A
      note: proxied records may return Cloudflare IP, not origin
    - command: dig +short www.roamkit.net A
      note: proxied records may return Cloudflare IP, not origin
    - command: dig +short staging.roamkit.net A
      note: proxied records may return Cloudflare IP, not origin
    - command: dig +short api.staging.roamkit.net A
      note: proxied records may return Cloudflare IP, not origin

cloudflare_ssl:
  mode: full  # or full_strict — never flexible
  location: Cloudflare → SSL/TLS → Overview

env:
  file: .env
  permissions: "600"
  required_secrets:
    - POSTGRES_PASSWORD
    - DJANGO_SECRET_KEY
  staging:
    DJANGO_SETTINGS_MODULE: config.settings.staging
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: api.staging.roamkit.net,staging.roamkit.net,roamkit.net,www.roamkit.net
    NEXT_PUBLIC_API_URL: https://api.staging.roamkit.net
    NODE_ENV: production
  later:
    - AIRALO_CLIENT_ID
    - AIRALO_CLIENT_SECRET
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - EMAIL_HOST
    - EMAIL_PORT
    - EMAIL_USE_TLS
    - EMAIL_HOST_USER
    - EMAIL_HOST_PASSWORD
    - DEFAULT_FROM_EMAIL
    - FRONTEND_BASE_URL
  template: .env.example

images:
  registry: ghcr.io
  api: ghcr.io/roamkit-net/roamkit-api
  web: ghcr.io/roamkit-net/roamkit-web
  env_vars:
    - API_IMAGE
    - WEB_IMAGE
  example_tag: develop

services:
  postgis:
    shared: true
    stack: /opt/stacks/data
    container: postgis
    network: postgis
    database: roamkit
    user: roamkit
  redis:
    shared: true
    stack: /opt/stacks/redis
    container: infra-redis
    network: hetzner_net
    url: redis://infra-redis:6379/4
  api:
    container: roamkit-api-staging
    image: ${API_IMAGE}
    profile: app
    port: 8000
    networks:
      - postgis
      - hetzner_net
      - proxy
    traefik:
      router: roamkit-api
      host: api.staging.roamkit.net
      service: roamkit-api
      entrypoint: websecure
      cert_resolver: cloudflare
    health: http://localhost:8000/health/live
  celery:
    container: roamkit-celery-staging
    image: ${API_IMAGE}
    profile: app
    command: celery -A config worker -l info
    networks:
      - postgis
      - hetzner_net
  celery-beat:
    container: roamkit-celery-beat-staging
    image: ${API_IMAGE}
    profile: app
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    networks:
      - postgis
      - hetzner_net
  web:
    container: roamkit-web-staging
    image: ${WEB_IMAGE}
    profile: app
    port: 3000
    network: proxy
    traefik:
      router: roamkit-web
      hosts:
        - roamkit.net
        - www.roamkit.net
        - staging.roamkit.net
      service: roamkit-web
      entrypoint: websecure
      cert_resolver: cloudflare
    health: http://localhost:3000/
    depends_on:
      - api

phases:
  - id: traefik_check
    description: Verify shared Traefik and proxy network
    requires: []
    commands:
      - cd /opt/stacks/roamkit-net
      - docker ps --filter name=traefik
      - docker network inspect proxy --format '{{.Name}}'
    expect:
      - traefik container Up
      - proxy network exists

  - id: dns
    description: Cloudflare DNS records (dashboard or API)
    status: completed
    completed_at: "2026-07"
    requires: []
    manual: true
    expect:
      - roamkit.net A proxied → 65.108.196.92
      - www.roamkit.net A proxied → 65.108.196.92
      - staging.roamkit.net A proxied → 65.108.196.92
      - api.staging.roamkit.net A proxied → 65.108.196.92
      - SSL mode Full or Full (strict) — verify manually in dashboard
    verify:
      - command: dig +short roamkit.net A
        expect: Cloudflare proxy IPs (not origin)
      - command: dig +short www.roamkit.net A
        expect: Cloudflare proxy IPs (not origin)
      - command: dig +short staging.roamkit.net A
        expect: Cloudflare proxy IPs (not origin)
      - command: dig +short api.staging.roamkit.net A
        expect: Cloudflare proxy IPs

  - id: env_secrets
    description: Configure server .env with production secrets
    requires: []
    commands:
      - cd /opt/stacks/roamkit-net
      - cp .env.example .env  # if new
      - nano .env
      - chmod 600 .env
    expect:
      - POSTGRES_PASSWORD set (not change-me)
      - DJANGO_SECRET_KEY set (50+ chars)
      - DJANGO_SETTINGS_MODULE=config.settings.staging

  - id: infra
    description: Verify shared postgis and infra-redis (no per-stack DB/Redis containers)
    requires:
      - traefik_check
    commands:
      - docker ps --filter name=postgis --format '{{.Names}} {{.Status}}'
      - docker ps --filter name=infra-redis --format '{{.Names}} {{.Status}}'
      - docker exec postgis pg_isready -U postgres
      - docker exec infra-redis redis-cli ping
    expect:
      - postgis Up (healthy)
      - infra-redis Up (healthy)
      - roamkit database exists on shared postgis

  - id: ghcr_images
    description: Build and push api/web images to GHCR (CI or manual)
    requires: []
    manual: true
    expect:
      - API_IMAGE tag exists on GHCR
      - WEB_IMAGE tag exists on GHCR

  - id: app
    description: Start api, celery, web with Traefik routing
    requires:
      - infra
      - env_secrets
      - ghcr_images
    commands:
      - cd /opt/stacks/roamkit-net
      - export API_IMAGE=ghcr.io/roamkit-net/roamkit-api:<tag>
      - export WEB_IMAGE=ghcr.io/roamkit-net/roamkit-web:<tag>
      - docker compose --profile app pull
      - docker compose --profile app up -d
    expect:
      - roamkit-api-staging healthy
      - roamkit-celery-staging Up
      - roamkit-celery-beat-staging Up
      - roamkit-web-staging healthy
      - roamkit-api router in Traefik (Host api.staging.roamkit.net)
      - roamkit-web router in Traefik (Host roamkit.net, www.roamkit.net, staging.roamkit.net)

  - id: deploy
    description: Full deploy pipeline with migrate and smoke test
    requires:
      - app
    command: ./scripts/deploy-staging.sh
    expect:
      - migrations applied
      - smoke test PASS

github_secrets:
  org: roamkit-net
  set_from: WSL  # not from staging server
  secrets:
    - name: STAGING_HOST
      value: 65.108.196.92
      command: echo -n "65.108.196.92" | gh secret set STAGING_HOST --org roamkit-net
    - name: STAGING_SSH_KEY
      command: gh secret set STAGING_SSH_KEY --org roamkit-net < ~/.ssh/id_ed25519
    - name: GHCR_TOKEN
      purpose: CI push/pull to GHCR

verification:
  internal:
    - command: docker compose exec api curl -sf http://localhost:8000/health/live
      expect: HTTP 200
    - command: docker compose exec api curl -sf http://localhost:8000/health/ready
      expect: HTTP 200
    - command: docker compose exec web curl -sf http://localhost:3000/
      expect: HTTP 200
  external:
    - command: curl -sf https://api.staging.roamkit.net/health/live
      expect: HTTP 200
    - command: curl -sf https://api.staging.roamkit.net/health/ready
      expect: HTTP 200
    - command: curl -sf https://roamkit.net/
      expect: HTTP 200
    - command: curl -sf https://staging.roamkit.net/
      expect: HTTP 200
  traefik:
    - command: docker logs traefik 2>&1 | tail -30 | grep -i roamkit || true
      expect: roamkit routers registered, no cert errors
  compose:
    - command: docker compose --profile app ps
      expect: api, celery, celery-beat, web Up/healthy when deployed

troubleshooting:
  - problem: 502 Bad Gateway
    checks:
      - docker compose ps — is api/web Up?
      - docker network inspect proxy — containers on proxy network?
  - problem: Router not visible in Traefik
    checks:
      - traefik labels in docker-compose.yml
      - traefik.docker.network=proxy set
      - traefik.http.routers.*.service links router to service
  - problem: Certificate error
    checks:
      - Cloudflare DNS proxied + SSL Full (not Flexible)
      - Traefik certresolver=cloudflare configured
      - docker logs traefik for ACME/DNS errors
  - problem: DB connection fail
    checks:
      - POSTGRES_* vars in .env
      - docker compose logs postgis
  - problem: DNS not resolving
    checks:
      - Cloudflare A records for staging and api.staging
      - wait 1–5 min for propagation
  useful_commands:
    - cd /opt/stacks/roamkit-net && docker compose logs -f api
    - cd /opt/stacks/roamkit-net && docker compose logs -f web
    - docker network inspect proxy --format '{{range .Containers}}{{.Name}} {{end}}'
